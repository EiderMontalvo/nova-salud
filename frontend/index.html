<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A4A4F" />
    <meta name="color-scheme" content="light dark" />
    <script>
      //aplica el tema guardado antes del primer pintado para evitar el destello claro en modo oscuro.
      try {
        var tema = localStorage.getItem('nova-salud-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = tema;
        document.documentElement.style.colorScheme = tema;
      } catch (e) {}
    </script>
    <meta name="description" content="Catálogo, ventas en mostrador e inventario de la botica Nova Salud." />
    <title>Nova Salud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
