components:
  schemas:
    Producto:
      type: object
      required: [id_producto, id_categoria, codigo, nombre, descripcion, imagen, precio, stock, stock_minimo, fecha_vencimiento, activo, fecha_creacion]
      properties:
        id_producto: {type: integer, example: 1}
        id_categoria: {type: integer, example: 1}
        codigo: {type: string, maxLength: 50, example: PROD-EJEMPLO}
        nombre: {type: string, maxLength: 150, example: Paracetamol 500mg}
        descripcion: {type: string, nullable: true}
        imagen: {type: string, nullable: true, description: Referencia de imagen. Las nuevas referencias deben ser URLs HTTPS sin credenciales}
        precio: {type: string, pattern: '^\d+\.\d{2}$', example: '3.50', description: Cadena decimal de MariaDB para conservar la precisión}
        stock: {type: integer, minimum: 0, example: 20}
        stock_minimo: {type: integer, minimum: 0, example: 5}
        fecha_vencimiento: {type: string, format: date, nullable: true, example: '2027-12-31', description: Fecha sin hora ni conversión de zona horaria}
        activo: {type: boolean, example: true}
        fecha_creacion: {type: string, format: date-time, nullable: true}
    ProductoCrear:
      type: object
      additionalProperties: false
      required: [id_categoria, codigo, nombre, precio]
      properties:
        id_categoria: {type: integer, minimum: 1, maximum: 2147483647, example: 1, description: Debe existir. Se permite conservar o asociar una categoría inactiva}
        codigo: {type: string, minLength: 1, maxLength: 50, example: PROD-EJEMPLO, description: Se recortan espacios exteriores. Debe ser único incluso entre productos inactivos}
        nombre: {type: string, minLength: 1, maxLength: 150, example: Paracetamol 500mg, description: Se recortan espacios exteriores. No puede quedar vacío}
        descripcion: {type: string, maxLength: 10000, nullable: true, default: null, example: Caja de tabletas}
        imagen: {type: string, format: uri, maxLength: 255, nullable: true, default: null, example: 'https://example.com/producto.jpg', description: URL HTTPS sin usuario ni contraseña. Solo se almacena la referencia; no se descarga ni se inspecciona el archivo}
        precio:
          description: 'Se acepta cadena decimal o número JSON, entre 0 y 99999999.99 y hasta dos decimales. Las cadenas no admiten signos, comas, espacios, notación exponencial ni ceros iniciales. Se normaliza a dos decimales sin redondear.'
          oneOf:
            - {type: string, pattern: '^(?:0|[1-9]\d{0,7})(?:\.\d{1,2})?$', example: '3.50'}
            - {type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, example: 3.5}
        stock: {type: integer, minimum: 0, maximum: 2147483647, default: 0, example: 20}
        stock_minimo: {type: integer, minimum: 0, maximum: 2147483647, default: 5, example: 5}
        fecha_vencimiento: {type: string, format: date, nullable: true, default: null, example: '2027-12-31', description: Fecha real YYYY-MM-DD desde 1000-01-01 hasta 9999-12-31. Se permite registrar productos vencidos para representar el inventario}
    ProductoActualizar:
      type: object
      additionalProperties: false
      required: [id_categoria, codigo, nombre, precio, stock, stock_minimo]
      properties:
        id_categoria: {$ref: '#/components/schemas/ProductoCrear/properties/id_categoria'}
        codigo: {$ref: '#/components/schemas/ProductoCrear/properties/codigo'}
        nombre: {$ref: '#/components/schemas/ProductoCrear/properties/nombre'}
        descripcion: {$ref: '#/components/schemas/ProductoCrear/properties/descripcion'}
        imagen: {$ref: '#/components/schemas/ProductoCrear/properties/imagen'}
        precio: {$ref: '#/components/schemas/ProductoCrear/properties/precio'}
        fecha_vencimiento: {$ref: '#/components/schemas/ProductoCrear/properties/fecha_vencimiento'}
        stock: {type: integer, minimum: 0, maximum: 2147483647, example: 20, description: Cantidad absoluta obligatoria. Solo ADMIN puede modificarla}
        stock_minimo: {type: integer, minimum: 0, maximum: 2147483647, example: 5}
        activo: {type: boolean, description: Si se omite conserva el estado actual. Enviar true permite reactivar el producto}
    RespuestaProducto:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string, example: Producto obtenido}
        data: {$ref: '#/components/schemas/Producto'}
  responses:
    ProductoNotFound:
      description: Producto inexistente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Producto no encontrado, errors: []}
    ProductoConflict:
      description: Código duplicado según la colación de MariaDB, incluso entre productos inactivos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Ya existe un producto con ese código, errors: []}
    ProductoBadRequest:
      description: Cuerpo, parámetros o campos inválidos, o categoría inexistente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: La categoría indicada no existe, errors: []}
  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      description: Identificador entero positivo del producto
      schema: {type: integer, minimum: 1, maximum: 2147483647}
      example: 1
paths:
  /api/productos:
    get:
      tags: [Productos]
      summary: Listar productos con búsqueda y paginación
      description: 'Requiere JWT de ADMIN o VENDEDOR. Devuelve activos por defecto, ordenados por id descendente. search usa LIKE sobre nombre o código; % y _ son comodines SQL. Los filtros se combinan con AND. Una categoría sin productos devuelve lista vacía. Se rechazan parámetros desconocidos o repetidos. Este endpoint reemplaza el listado público anterior: ahora devuelve un objeto con data y pagination.'
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
          example: 1
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: search
          in: query
          schema: {type: string, maxLength: 150}
          example: paracetamol
        - name: activo
          in: query
          description: false para consultar productos desactivados
          schema: {type: boolean, default: true}
        - name: id_categoria
          in: query
          description: Filtrar por categoría
          schema: {type: integer, minimum: 1, maximum: 2147483647}
          example: 1
      responses:
        '200':
          description: Lista paginada. data vacío y total_pages 0 si no hay coincidencias
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, pagination]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: Productos obtenidos}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Producto'}
                  pagination: {$ref: '#/components/schemas/Paginacion'}
        '400': {$ref: '#/components/responses/ProductoBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Productos]
      summary: Registrar un producto
      description: Requiere ADMIN. Se crea activo. No acepta archivos ni imágenes binarias. Las solicitudes y respuestas de ejemplo son ilustrativas
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductoCrear'}
            example: {id_categoria: 1, codigo: PROD-EJEMPLO, nombre: Paracetamol 500mg, precio: '3.50', stock: 20, stock_minimo: 5, fecha_vencimiento: '2027-12-31', imagen: null}
      responses:
        '201':
          description: Producto registrado
          headers:
            Location:
              description: URL del producto
              schema: {type: string, example: /api/productos/1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaProducto'}
        '400': {$ref: '#/components/responses/ProductoBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ProductoConflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/productos/{id}:
    parameters:
      - {$ref: '#/components/parameters/ProductoId'}
    get:
      tags: [Productos]
      summary: Consultar un producto por id
      description: Requiere JWT de ADMIN o VENDEDOR. Permite consultar productos activos e inactivos, incluidos los vencidos
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Producto obtenido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaProducto'}
        '400': {$ref: '#/components/responses/ProductoBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/ProductoNotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Productos]
      summary: Actualizar los datos y existencias de un producto
      description: 'Requiere ADMIN. Reemplaza los campos del producto. stock y stock_minimo son obligatorios para evitar reiniciarlos por omisión. descripcion, imagen y fecha_vencimiento omitidos quedan en null. activo conserva el valor actual si se omite; true permite reactivar. No elimina detalles de ventas asociados.'
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductoActualizar'}
            example: {id_categoria: 1, codigo: PROD-EJEMPLO, nombre: Paracetamol 500mg, precio: '4.00', stock: 25, stock_minimo: 8, fecha_vencimiento: '2027-12-31', activo: true}
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaProducto'}
        '400': {$ref: '#/components/responses/ProductoBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ProductoNotFound'}
        '409': {$ref: '#/components/responses/ProductoConflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Productos]
      summary: Desactivar un producto
      description: Requiere ADMIN. Cambia activo a false, conserva stock y referencias históricas de ventas. Repetir la operación sobre un producto existente devuelve 204
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Producto desactivado. Respuesta sin cuerpo}
        '400': {$ref: '#/components/responses/ProductoBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ProductoNotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
