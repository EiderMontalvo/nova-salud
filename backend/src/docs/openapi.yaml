components:
  schemas:
    RespuestaError:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
      example: {success: false, message: 'Datos de solicitud inválidos', errors: [{field: body.nombre, message: 'El nombre es obligatorio'}]}
    Usuario:
      type: object
      required: [id_usuario, nombre, correo, rol, activo, fecha_creacion]
      properties:
        id_usuario: {type: integer, example: 1}
        nombre: {type: string, example: 'Administrador de ejemplo'}
        correo: {type: string, format: email, example: admin@example.com}
        rol: {type: string, enum: [ADMIN, VENDEDOR]}
        activo: {type: boolean}
        fecha_creacion: {type: string, format: date-time, nullable: true}
    Categoria:
      type: object
      required: [id_categoria, nombre, descripcion, activo]
      properties:
        id_categoria: {type: integer, example: 1}
        nombre: {type: string, maxLength: 100, example: Analgésicos}
        descripcion: {type: string, maxLength: 255, nullable: true, example: Medicamentos para el dolor}
        activo: {type: boolean, example: true}
    CategoriaCrear:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100, description: Se recortan espacios exteriores. No se aceptan nombres vacíos ni duplicados, example: Analgésicos}
        descripcion: {type: string, maxLength: 255, nullable: true, default: null, example: Medicamentos para el dolor}
    CategoriaActualizar:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100, example: Analgésicos}
        descripcion: {type: string, maxLength: 255, nullable: true, default: null, description: Si se omite queda en null}
        activo: {type: boolean, description: Si se omite conserva el estado actual. Enviar true permite reactivar una categoría}
    RespuestaCategoria:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string, example: Categoría obtenida}
        data: {$ref: '#/components/schemas/Categoria'}
    Paginacion:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page: {type: integer, example: 1}
        limit: {type: integer, example: 20}
        total: {type: integer, example: 1}
        total_pages: {type: integer, example: 1}
  parameters:
    CategoriaId:
      name: id
      in: path
      required: true
      description: Identificador entero positivo de la categoría
      schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      example: 1
  responses:
    BadRequest:
      description: JSON, parámetros o campos inválidos. No se aceptan campos desconocidos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
    Unauthorized:
      description: Credenciales incorrectas, token ausente, inválido o vencido, o usuario inactivo
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Se requiere un token Bearer, errors: []}
    Forbidden:
      description: Solo ADMIN puede realizar esta operación
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Se requiere el rol ADMIN, errors: []}
    NotFound:
      description: Categoría inexistente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Categoría no encontrada, errors: []}
    Conflict:
      description: El nombre ya está registrado, incluso si la categoría está inactiva
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Ya existe un registro con ese nombre o correo, errors: []}
    ServerError:
      description: Error interno sin información sensible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: Error interno del servidor, errors: []}
    TooLarge:
      description: El cuerpo JSON excede 1 MB
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RespuestaError'}
          example: {success: false, message: El cuerpo excede el límite de 1 MB, errors: []}
paths:
  /:
    get:
      tags: [Sistema]
      summary: Consultar la información de la API
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                required: [name, version, status]
                properties:
                  name: {type: string, example: Nova Salud API}
                  version: {type: string, example: 1.0.0}
                  status: {type: string, example: online}
  /api/health:
    get:
      tags: [Sistema]
      summary: Verificar el estado de la API
      description: No requiere autenticación ni consulta MariaDB
      responses:
        '200':
          description: API en funcionamiento
          content:
            application/json:
              schema:
                type: object
                required: [success, message, timestamp]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: API en funcionamiento}
                  timestamp: {type: string, format: date-time}
  /api/health/db:
    get:
      tags: [Sistema]
      summary: Verificar conexión a MariaDB
      description: Ejecuta SELECT 1 sin modificar datos. No requiere autenticación
      responses:
        '200':
          description: Conexión disponible
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: Conexión a la base de datos exitosa}
        '503':
          description: MariaDB no está disponible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaError'}
              example: {success: false, message: No se pudo conectar a la base de datos, errors: []}
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: 'No existe registro público. Devuelve un JWT HS256 válido por una hora. Hasta 10 intentos fallidos por IP en 15 minutos; los accesos correctos no consumen el límite. La contraseña admite entre 8 caracteres y 72 bytes UTF-8. Los ejemplos son ilustrativos, no credenciales existentes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [correo, password]
              properties:
                correo: {type: string, format: email, maxLength: 100}
                password: {type: string, format: password, minLength: 8, description: Máximo 72 bytes UTF-8}
            example: {correo: admin@example.com, password: contraseña-de-ejemplo}
      responses:
        '200':
          description: Inicio de sesión correcto. Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: Inicio de sesión correcto}
                  data:
                    type: object
                    required: [token, token_type, expires_in, usuario]
                    properties:
                      token: {type: string, description: Copiar este valor en Authorize sin el prefijo Bearer}
                      token_type: {type: string, enum: [Bearer]}
                      expires_in: {type: integer, example: 3600, description: Vigencia en segundos}
                      usuario: {$ref: '#/components/schemas/Usuario'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429':
          description: Límite de intentos alcanzado. Consultar Retry-After (segundos) para reintentar
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaError'}
              example: {success: false, message: Demasiados intentos. Intenta nuevamente en 15 minutos, errors: []}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar el usuario autenticado
      description: Verifica el token y el usuario activo en MariaDB. No devuelve contraseñas ni hashes
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Usuario actual. Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: Usuario autenticado}
                  data: {$ref: '#/components/schemas/Usuario'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/categorias:
    get:
      tags: [Categorías]
      summary: Listar categorías con paginación
      description: 'Disponible para ADMIN y VENDEDOR. Devuelve categorías activas por defecto, ordenadas por id descendente. search busca por nombre usando LIKE. No se aceptan parámetros desconocidos. Un resultado vacío devuelve data vacío y total_pages igual a 0.'
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
          example: 1
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: search
          in: query
          schema: {type: string, maxLength: 100}
          example: analg
        - name: activo
          in: query
          description: Usar false para consultar categorías desactivadas
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, pagination]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string, example: Categorías obtenidas}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Categoria'}
                  pagination: {$ref: '#/components/schemas/Paginacion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Categorías]
      summary: Crear una categoría
      description: Requiere ADMIN. El nombre debe ser único según la colación de MariaDB. Se crea activa
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaCrear'}
      responses:
        '201':
          description: Categoría creada
          headers:
            Location:
              description: URL de la categoría
              schema: {type: string, example: /api/categorias/1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaCategoria'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/categorias/{id}:
    parameters:
      - {$ref: '#/components/parameters/CategoriaId'}
    get:
      tags: [Categorías]
      summary: Consultar una categoría
      description: Disponible para ADMIN y VENDEDOR. Permite consultar categorías activas e inactivas por id
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Categoría obtenida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaCategoria'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Categorías]
      summary: Actualizar una categoría
      description: Requiere ADMIN. Reemplaza nombre y descripción; conserva activo si se omite. Permite reactivar enviando activo true
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaActualizar'}
            example: {nombre: Analgésicos, descripcion: Medicamentos para el dolor, activo: true}
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaCategoria'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Categorías]
      summary: Desactivar una categoría
      description: Requiere ADMIN. Eliminación lógica e idempotente. Conserva la categoría y sus relaciones con productos. No desactiva los productos asociados
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Categoría desactivada. Respuesta sin cuerpo}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
